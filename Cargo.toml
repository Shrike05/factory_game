[package]
name = "factory"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version= "0.20.0", features = ["bevy_picking"] }
bitmaps = "3.2.1"
bevy_devtools = { git = "https://github.com/Shrike05/bevy_devtools.git", optional = true, tag = "0.2.01" }
regex = "1.12.3"
clap = {version = "4.6.0", features = ["derive"]}
serde = "1.0.228"
toml = "1.1.8"
strum_macros = "0.28.0"
strum = "0.28.0"

[features]
dev_tools = ["dep:bevy_devtools"]

[lints.rust]
unused = "allow"
